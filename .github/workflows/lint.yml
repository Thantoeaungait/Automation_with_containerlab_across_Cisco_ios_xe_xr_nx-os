# Static checks on GitHub's free runners. The lab itself needs KVM + Cisco images,
# so it runs locally (`make ci`), not here.
name: lint

on:
  push:
    branches: [main, dev1]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible.cfg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          pip install -q yamllint "ansible-core>=2.17,<2.21" jinja2 netaddr pyyaml
      - name: yamllint
        run: yamllint -c .yamllint topology sot ansible validation nr .github
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh api/gnmi_check.sh
      - name: Python syntax
        run: python -m py_compile nr/*.py api/*.py validation/*.py scripts/*.py
      - name: Ansible syntax check
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
          ansible-playbook --syntax-check ansible/playbooks/bootstrap.yml ansible/playbooks/configure.yml
      - name: Render templates from SoT
        run: python scripts/render_templates.py --change sot/changes/loopback100.yml
