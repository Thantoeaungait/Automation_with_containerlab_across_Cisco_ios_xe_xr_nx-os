[defaults]
inventory              = ./ansible/inventory/sot.py
vault_password_file    = ~/.config/mvauto/vault-pass
collections_path       = ./ansible/collections
host_key_checking      = False
gathering              = explicit
retry_files_enabled    = False
callback_result_format = yaml
forks                  = 10
timeout                = 60
interpreter_python     = auto_silent
deprecation_warnings   = False

[persistent_connection]
connect_timeout = 180
command_timeout = 180

[paramiko_connection]
# Lab nodes get new host keys on every deploy: never record or verify them (lab only!)
host_key_checking = False
host_key_auto_add = False
record_host_keys  = False
look_for_keys     = False
