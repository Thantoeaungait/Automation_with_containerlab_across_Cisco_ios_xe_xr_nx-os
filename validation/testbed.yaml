testbed:
  name: mvauto
  credentials:
    default:
      username: admin
      password: admin

devices:
  xe1:
    os: iosxe
    platform: cat8k
    type: router
    connections:
      cli:
        protocol: ssh
        ip: 172.30.30.11
        port: 22
        ssh_options: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

  xr1:
    os: iosxr
    type: router
    credentials:
      default:
        username: clab
        password: clab@123
    connections:
      cli:
        protocol: ssh
        ip: 172.30.30.12
        port: 22
        ssh_options: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

  nx1:
    os: nxos
    platform: n9k
    type: switch
    connections:
      cli:
        protocol: ssh
        ip: 172.30.30.13
        port: 22
        ssh_options: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
