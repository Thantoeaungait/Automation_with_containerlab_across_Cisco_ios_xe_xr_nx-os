# Two tiers:
#   lint  -> runs on GitLab shared runners for every MR (no images, no KVM needed)
#   lab   -> runs the real lab on YOUR self-hosted runner (tags: kvm, clab)
stages: [lint, lab]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck make >/dev/null
    - pip install -q yamllint "ansible-core>=2.17,<2.21" jinja2 netaddr pyyaml
  variables:
    ANSIBLE_CONFIG: ansible.cfg
  script:
    - yamllint -c .yamllint topology sot ansible validation nr .gitlab-ci.yml
    - shellcheck -S warning scripts/*.sh api/gnmi_check.sh
    - python -m py_compile nr/*.py api/*.py validation/*.py
    - ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
    - ansible-playbook --syntax-check ansible/playbooks/bootstrap.yml ansible/playbooks/configure.yml
    - python scripts/render_templates.py

lab:
  stage: lab
  tags: [kvm, clab]            # shell executor on an Ubuntu 26.04 host with images pre-built
  resource_group: mvauto-lab   # one lab per host (fixed mgmt subnet and node names)
  timeout: 2h
  rules:
    - if: $LAB_RUNNER_AVAILABLE == "true"   # set this CI/CD variable in your fork/project
  variables:
    TOPO: topology/lab.clab.yml
  script:
    - make deps
    - ./scripts/ci.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/, backups/]
    reports:
      junit: reports/validation-*.xml
