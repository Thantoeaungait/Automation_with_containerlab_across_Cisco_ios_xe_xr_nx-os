---
# Return every device to the checkpoint taken by checkpoint.yml (make rollback).
- name: Roll back to the last checkpoint
  hosts: lab
  gather_facts: false
  vars:
    checkpoint_dir: "{{ playbook_dir }}/../../reports/checkpoint"

  tasks:
    - name: IOS XE - replace running-config with the checkpoint
      when: ansible_network_os == 'cisco.ios.ios'
      cisco.ios.ios_command:
        commands: configure replace bootflash:mvauto-checkpoint.cfg force

    - name: NX-OS - roll back to the checkpoint
      when: ansible_network_os == 'cisco.nxos.nxos'
      cisco.nxos.nxos_command:
        commands: rollback running-config checkpoint mvauto

    - name: IOS XR - roll back to the recorded commit
      when: ansible_network_os == 'cisco.iosxr.iosxr'
      cisco.iosxr.iosxr_command:
        commands: "rollback configuration to {{ lookup('file', checkpoint_dir ~ '/' ~ inventory_hostname ~ '.commit') }}"
