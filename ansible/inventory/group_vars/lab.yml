---
ansible_connection: ansible.netcommon.network_cli
ansible_network_cli_ssh_type: paramiko   # predictable; libssh is faster but pickier about wheels
ansible_command_timeout: 180
ansible_connect_timeout: 180
ansible_host_key_checking: false         # lab: every deploy generates new host keys
ansible_paramiko_host_key_checking: false

# Credentials come from the encrypted vault (group_vars/all/vault.yml -> secrets/vault.yml).
# `platform` is set per host by the SoT inventory (ansible/inventory/sot.py).
ansible_user: "{{ credentials[platform].username }}"
ansible_password: "{{ credentials[platform].password }}"
