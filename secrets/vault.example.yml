---
# Template for secrets/vault.yml. `make vault-init` copies this, replaces the
# CHANGE_ME values with random strings and encrypts the result with ansible-vault.
# Edit later with: make vault-edit
credentials:            # one entry per platform (sot/fabric.yml -> platforms)
  iosxe: { username: admin, password: admin }       # containerlab defaults
  iosxr: { username: clab, password: clab@123 }
  nxos: { username: admin, password: admin }

tacacs:
  key: CHANGE_ME_TACACS_KEY        # shared secret between devices and the TACACS+ server
  users:                           # human accounts, authenticated only by TACACS+
    netops: CHANGE_ME_NETOPS_PASSWORD

pki:
  p12_password: CHANGE_ME_P12_PASSWORD   # protects the device certificate bundles

netbox:
  token: CHANGE_ME_NETBOX_TOKEN   # create an API token in NetBox, then: make vault-edit
