# GENERATED from sot/fabric.yml by scripts/gen_topology.py - do not edit by hand.
# Change the SoT, then run: make topology
name: mvauto

mgmt:
  network: mvauto-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    cisco_c8000v:
      image: ${C8KV_IMAGE:=vrnetlab/cisco_c8000v:17.13.01a}
      env:
        QEMU_MEMORY: ${C8KV_MEMORY:=4096}
        QEMU_SMP: ${C8KV_SMP:=1}
    cisco_xrv9k:
      image: ${XRV9K_IMAGE:=vrnetlab/cisco_xrv9k:24.3.1}
    cisco_n9kv:
      image: ${N9KV_IMAGE:=vrnetlab/cisco_n9kv:9500-lite-10.5.5.M}
      env:
        QEMU_MEMORY: ${N9KV_MEMORY:=6144}
        QEMU_SMP: ${N9KV_SMP:=2}

  nodes:
    xe1:
      kind: cisco_c8000v
      mgmt-ipv4: 172.30.30.11
    xr1:
      kind: cisco_xrv9k
      mgmt-ipv4: 172.30.30.12
      startup-config: configs/xr1.cfg
    nx1:
      kind: cisco_n9kv
      mgmt-ipv4: 172.30.30.13
    tacacs:
      kind: linux
      image: lfkeitel/tacacs_plus:latest
      mgmt-ipv4: 172.30.30.20
      binds:
        - configs/tac_plus.cfg:/etc/tac_plus/tac_plus.cfg:ro

  links:
    - endpoints: ["xe1:Gi2", "xr1:Gi0/0/0/0"]
    - endpoints: ["xe1:Gi3", "nx1:Ethernet1/2"]
    - endpoints: ["xr1:Gi0/0/0/1", "nx1:Ethernet1/1"]
