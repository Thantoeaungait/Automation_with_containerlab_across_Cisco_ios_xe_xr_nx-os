# Same lab, but IOS XR runs as XRv9000 (full VM: needs ~16 GB RAM, boots in 15-25 min).
# Interface names, IPs and credentials are identical, so every automation file is reused as-is.
name: mvauto

mgmt:
  network: mvauto-mgmt
  ipv4-subnet: 172.30.30.0/24
  mtu: 1500

topology:
  kinds:
    cisco_c8000v:
      image: ${C8KV_IMAGE:=vrnetlab/cisco_c8000v:17.15.01a}
    cisco_xrv9k:
      image: ${XRV9K_IMAGE:=vrnetlab/cisco_xrv9k:7.11.2}
    cisco_n9kv:
      image: ${N9KV_IMAGE:=vrnetlab/cisco_n9kv:10.4.3.F}
      env:
        QEMU_MEMORY: ${N9KV_MEMORY:=10240}   # MB; n9kv-lite works with 6144
        QEMU_SMP: ${N9KV_SMP:=4}             # n9kv-lite works with 2

  nodes:
    xe1:
      kind: cisco_c8000v
      mgmt-ipv4: 172.30.30.11
    xr1:
      kind: cisco_xrv9k
      mgmt-ipv4: 172.30.30.12     # clab / clab@123
      startup-config: configs/xr1.cfg   # raise SSH rate limit before automation connects
    nx1:
      kind: cisco_n9kv
      mgmt-ipv4: 172.30.30.13

  links:
    # xrv9k: eth1 -> GigabitEthernet0/0/0/0, eth2 -> GigabitEthernet0/0/0/1
    - endpoints: ["xe1:eth1", "xr1:eth1"]
    - endpoints: ["xr1:eth2", "nx1:eth1"]
    - endpoints: ["nx1:eth2", "xe1:eth2"]
